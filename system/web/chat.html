<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>对话 - SimCSE</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .chat-page { max-width: 760px; margin: 0 auto; padding: 0 16px 24px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; }
    .topbar .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .topbar .logo-sm { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(140deg, #1a9d94, #17656a); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 0.75rem; }
    .topbar h1 { font-size: 1.05rem; margin: 0; }
    .topbar .toggles { display: flex; gap: 12px; align-items: center; font-size: 0.85rem; }
    .topbar .toggles label { display: flex; align-items: center; gap: 4px; cursor: pointer; color: #4d5a68; }
    .chat-window { height: calc(100vh - 200px); min-height: 400px; overflow-y: auto; padding: 16px; border: 1px solid #f2e2c9; border-radius: 14px; background: linear-gradient(180deg, #fffefc, #fff8ea); margin-bottom: 10px; }
    .composer { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    #chat-input { width: 100%; resize: none; border: 1px solid #e8d6b4; border-radius: 10px; padding: 11px; font-size: 15px; background: #fff; }
    .status { color: #1f9d55; font-size: 0.8rem; margin: 4px 0 0; }
    .dot { font-size: 1.5rem; font-weight: 700; transition: opacity 0.2s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #e8d6b4; border-top-color: #1b7f79; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 4px; }
  </style>
</head>
<body>
  <div class="chat-page">
    <header class="topbar">
      <a href="/" class="brand">
        <div class="logo-sm">sim</div>
        <h1>SimCSE 对话</h1>
      </a>
      <div class="toggles">
        <label><input type="checkbox" id="ctx-toggle" checked /> 上下文</label>
        <label><input type="checkbox" id="ai-toggle" /> AI增强</label>
        <button id="clear-ctx" type="button" style="font-size:0.8rem;padding:4px 10px;">清除记忆</button>
        <button id="clear-chat" type="button" style="font-size:0.8rem;padding:4px 10px;">清空对话</button>
      </div>
    </header>

    <div id="chat-window" class="chat-window"></div>
    <form id="chat-form" class="composer">
      <textarea id="chat-input" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行..." required></textarea>
      <button id="send-btn" type="submit">发送</button>
    </form>
    <p id="status" class="status">就绪</p>
  </div>

  <script src="/static/chat.js"></script>
</body>
</html>
