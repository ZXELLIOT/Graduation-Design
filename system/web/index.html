<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimCSE 检索式对话系统</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .landing { max-width: 640px; margin: 60px auto 0; text-align: center; padding: 0 20px; }
    .landing h1 { font-size: 1.6rem; margin-bottom: 6px; }
    .landing .subtitle { color: #5a6674; font-size: 0.95rem; margin-bottom: 28px; }
    .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 28px; text-align: left; }
    .feature-card { background: #fffdf8; border: 1px solid #f0d9b5; border-radius: 10px; padding: 12px 16px; }
    .feature-card h3 { margin: 0 0 4px; font-size: 0.9rem; }
    .feature-card p { margin: 0; color: #5a6674; font-size: 0.82rem; line-height: 1.4; }
    .entry-buttons { display: flex; gap: 16px; justify-content: center; align-items: flex-start; }
    .entry-btn { display: inline-block; padding: 12px 28px; border-radius: 10px; text-decoration: none; color: #fff; font-size: 1rem; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s; }
    .entry-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,0.15); }
    .entry-btn.btn-chat { background: linear-gradient(135deg, #1b7f79 0%, #2aa198 100%); }
    .entry-btn.btn-admin { background: linear-gradient(135deg, #f08a4b 0%, #d4733a 100%); }
    .entry-btn small { display: block; font-weight: 400; font-size: 0.8rem; margin-top: 4px; opacity: 0.85; }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow-left"></div>
  <div class="bg-glow bg-glow-right"></div>

  <main class="landing">
    <div class="logo" aria-hidden="true" style="margin:0 auto 20px; width:72px; height:72px; font-size:1.3rem;">sim</div>
    <h1>SimCSE 检索式对话系统</h1>
    <p class="subtitle">基于对比学习的双塔语义匹配 · FAISS 向量检索 · AI 增强生成</p>

    <div class="feature-grid">
      <div class="feature-card">
        <h3>双塔语义匹配</h3>
        <p>SimCSE 两阶段微调的 Query/Response 双编码器，精准捕捉对话语义</p>
      </div>
      <div class="feature-card">
        <h3>高性能检索</h3>
        <p>FAISS HNSW 图索引粗召回 + 问问/问答加权重排，百万级语料毫秒响应</p>
      </div>
      <div class="feature-card">
        <h3>上下文感知</h3>
        <p>可配置上下文窗口，自动拼接多轮历史，理解对话上下文</p>
      </div>
      <div class="feature-card">
        <h3>AI 增强生成</h3>
        <p>可选大模型融合检索候选，生成更自然流畅的回复</p>
      </div>
    </div>

    <div class="entry-buttons">
      <a href="/chat" class="entry-btn btn-chat">开始对话</a>
      <a href="/admin" class="entry-btn btn-admin">后台管理</a>
    </div>
  </main>
</body>
</html>
