<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sim-检索式对话机器人</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="bg-glow bg-glow-left"></div>
  <div class="bg-glow bg-glow-right"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">sim</div>
      <div>
        <h1>sim-检索式对话机器人</h1>
        <p>本地检索对话系统</p>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="chat card">
      <div class="chat-header">
        <div class="chat-header-row">
          <h2>开始对话</h2>
          <button id="clear-chat" type="button">清除对话</button>
        </div>
        <p class="subtitle">支持回车发送，Shift+Enter 换行</p>
      </div>

      <div id="chat-window" class="chat-window"></div>
      <form id="chat-form" class="composer">
        <textarea id="chat-input" rows="2" placeholder="请输入内容，和 sim 聊聊吧..." required></textarea>
        <button id="send-btn" type="submit">发送</button>
      </form>
      <p id="status" class="status">服务就绪</p>

      <section class="perf-panel" aria-label="实时性能监控">
        <div class="perf-head">
          <h3>实时性能</h3>
          <span id="perf-last-updated">--:--:--</span>
        </div>
        <div class="perf-kpis">
          <span id="perf-cpu">CPU --%</span>
          <span id="perf-mem">内存 --%</span>
          <span id="perf-chat-avg">会话均时延 -- ms</span>
          <span id="perf-chat-p95">会话P95 -- ms</span>
        </div>
        <div class="perf-grid">
          <article class="perf-card">
            <div class="perf-title">设备负载(CPU/内存)</div>
            <canvas id="perf-device-chart" height="150"></canvas>
          </article>
          <article class="perf-card">
            <div class="perf-title">系统对话耗时</div>
            <canvas id="perf-chat-chart" height="150"></canvas>
          </article>
        </div>
      </section>
    </section>

    <section class="logs card">
      <div class="logs-head">
        <h2>最近日志</h2>
        <div>
          <button id="refresh-logs" type="button">刷新</button>
          <button id="clear-logs" type="button">清除日志</button>
        </div>
      </div>

      <div class="settings-box">
        <div class="settings-title">调参面板</div>
        <div class="setting-grid">
          <label for="similarity-threshold">命中阈值</label>
          <input id="similarity-threshold" type="number" min="0" max="1" step="0.01" value="0.50" />

          <label for="rerank-query-weight">问问权重</label>
          <input id="rerank-query-weight" type="number" min="0" max="2" step="0.01" value="0.75" />

          <label for="rerank-reply-weight">问答权重</label>
          <input id="rerank-reply-weight" type="number" min="0" max="2" step="0.01" value="0.25" />

          <label for="context-max-turns">上下文轮数</label>
          <input id="context-max-turns" type="number" min="1" max="10" step="1" value="3" />

          <label for="context-matching-enabled">上下文匹配</label>
          <input id="context-matching-enabled" type="checkbox" checked />

          <label for="coarse-recall-count">粗召回数量</label>
          <input id="coarse-recall-count" type="number" min="0" max="10000" step="1" value="500" />

          <label for="rerank-top-k">精排数量</label>
          <input id="rerank-top-k" type="number" min="1" max="200" step="1" value="5" />

          <label for="ai-enhanced">AI增强</label>
          <input id="ai-enhanced" type="checkbox" />
        </div>
        <div class="settings-actions">
          <button id="reload-settings" type="button">读取当前</button>
          <button id="apply-settings" type="button">应用参数</button>
        </div>
      </div>

      <div id="logs-panel" class="logs-panel"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
